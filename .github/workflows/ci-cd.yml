name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Angular SSG
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Angular SSG production
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: angular-ssg-build
          path: dist/

  test:
    name: Run Angular Tests
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: angular-ssg-build
          path: dist
      - name: Run unit tests
        run: npm test

  artifact:
    name: Build Docker Image
    runs-on: ubuntu-26.04
    environment: Production
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: angular-ssg-build
          path: dist
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to private container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag ${{ secrets.DOCKER_REGISTRY_HOST }}/reparieren-statt-wegwerfen:latest .
      - name: Publish Docker image
        run: docker push ${{ secrets.DOCKER_REGISTRY_HOST }}/reparieren-statt-wegwerfen:latest

  deploy:
    name: Deploy artifact
    needs: [ artifact ]
    runs-on: ubuntu-26.04
    environment: Production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Run remote deployment script
        run: >-
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "sh /cloud/scripts/reparieren-statt-wegwerfen-deploy.sh"
