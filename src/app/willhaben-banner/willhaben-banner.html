<mat-card class="willhaben-banner">
  <div class="banner-content">

    <div class="logo-container">
      <img alt="willhaben" class="willhaben-logo" src="willhaben-logo.png">
    </div>

    <div class="text-container">
      <h3 class="headline">
        Unsere Geräte findest du auf <app-willhaben-link/>.
      </h3>
      <p class="subline">
        Genieße volle Apple Silicon Power mit einem deutlich kleineren ökologischen Fußabdruck.
      </p>
    </div>

    <div class="action-container">
      <a (click)="analyticsService.trackEvent(AnalyticsCategory.WILLHABEN_BUTTON_CLICKED, 'Willhaben Shop URL opened')"
         [href]="urls.willhabenShop"
         class="open-profile-btn"
         matButton="filled" target="_blank">
        <mat-icon>arrow_right_alt</mat-icon>
        Willhaben Shop öffnen
      </a>
    </div>

  </div>
</mat-card>
